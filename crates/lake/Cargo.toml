[package]
name = "funnel-lake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Publishes Funnel rollups to Apache Iceberg and queries them with Apache DataFusion"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
datafusion = "54"
funnel-sketch = { path = "../sketch" }
iceberg = "0.11"
iceberg-catalog-sql = "0.11"
iceberg-datafusion = "0.11"
parquet = "58.4"
serde_json = "1.0.154"
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
rand = "0.9"
tempfile = "3"

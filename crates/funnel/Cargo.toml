[package]
name = "funnel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Metrics pipeline that rolls metrics up at ingest and stores them compactly"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
funnel-sketch = { path = "../sketch" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
arrow-array = "60"
arrow-schema = "60"
bytes = "1.12.1"
loadgen = { path = "../loadgen" }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
proptest = "1.12"
zstd = "0.13"
